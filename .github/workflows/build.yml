name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS
          # geode-sdk/bindings changes on 2026-10-27 break iOS codegen; pin to the day before
          bindings-ref: 054c5b33408ae9863d896f1d2eab3b7e660adeba

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          bindings-ref: ${{ matrix.config.bindings-ref }}

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          cmake --build build --parallel 1 2>&1 | grep -iE "error|undefined|ld:" | head -25 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: force-120fps-geode
          path: ${{ steps.build.outputs.build-output }}
