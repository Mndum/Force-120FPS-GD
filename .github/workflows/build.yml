name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS
          # Geode's iOS code generator is broken on current bindings; use the
          # bindings from Geode 5.6.1's release (the version this mod targets)
          bindings-ref: 73c37ae95c922b55a421b6be2ea55c16182e2112

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          bindings-ref: ${{ matrix.config.bindings-ref }}

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          cmake --build build --parallel 1 2>&1 | grep -iE "error|undefined|ld:" | head -25 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    # Package whatever platforms built, even if one (iOS) failed
    if: ${{ !cancelled() }}
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: force-120fps-geode
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish to the "Latest build" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find "${{ steps.build.outputs.build-output }}" -name '*.geode')
          echo "Found: $files"
          gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest-build --repo "$GITHUB_REPOSITORY" --title "Latest build" \
              --notes "Automatic build of Force 120 FPS. Download the .geode file below and drop it in your Geode mods folder."
          gh release upload latest-build $files --repo "$GITHUB_REPOSITORY" --clobber
